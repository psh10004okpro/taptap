<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>TapTap Titans</title>
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="theme-color" content="#0d0a1a" />
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #0d0a1a;
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* 노치/홈바 안전영역. viewport-fit=cover 로 화면 전체를 쓰되 캔버스는
       안전영역 안에만 놓는다 — 하단 탭 바가 제스처 홈바에 먹히지 않게.
       env() 를 변수로 감싸 두면 테스트에서 값을 주입해 검증할 수 있다. */
    :root {
      --sa-top: env(safe-area-inset-top, 0px);
      --sa-right: env(safe-area-inset-right, 0px);
      --sa-bottom: env(safe-area-inset-bottom, 0px);
      --sa-left: env(safe-area-inset-left, 0px);
    }
    #app {
      position: absolute;
      top: var(--sa-top); right: var(--sa-right);
      bottom: var(--sa-bottom); left: var(--sa-left);
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
